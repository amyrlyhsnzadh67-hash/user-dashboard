<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>

<body class="bg-gray-100">


    <header class="flex items-center justify-between gap-2.5 lg:gap-0 shadow-sm border-2 border-white px-8 py-3">

        <div class="flex items-center gap-1.5 lg:gap-2.5">

            <div>
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-user-round-group preview-icon stroke-green-900">
                    <path d="M17 21a5 5 0 00-10 0" />
                    <path d="M22 10.5a3.5 3.5 0 00-5.507-2.868" />
                    <path d="M7.507 7.632A3.5 3.5 0 002 10.5" />
                    <circle cx="12" cy="13" r="3" />
                    <circle cx="18.5" cy="4.5" r="2.5" />
                    <circle cx="5.5" cy="4.5" r="2.5" />
                </svg>
            </div>

            <div>
                <h2 class="text-sm md:text-lg lg:text-2xl text-gray-800 font-bold">User<span
                        class="text-green-900">Dashboard</span></h2>
                <p class="text-gray-700 lg:text-sm">Learn . Practice . Grow</p>
            </div>

        </div>

        <nav>
            <ul class="hidden lg:flex items-center gap-5">
                <li><a class="text-gray-700 font-bold" href="">Home</a></li>
                <li><a class="text-gray-700 font-bold" href="">About</a></li>
            </ul>
        </nav>

        <div class="hidden lg:flex items-center gap-4">
            <button
                class="cursor-pointer bg-green-900 text-white font-bold px-6 py-2.5 rounded-lg shadow-md
                hover:scale-105 hover:border-2 border-green-900 hover:bg-white hover:text-green-900 transition-all duration-500">Sign
                Up</button>

            <button
                class="group cursor-pointer flex items-center gap-2 bg-white border-2 border-green-900 text-green-900 font-bold px-6 py-2
                rounded-lg shadow-md hover:scale-105 hover:bg-green-900 hover:border-green-900 hover:text-white transition-all duration-500">Login
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="#0e4503" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-right preview-icon group-hover:stroke-white">
                    <path d="M5 12h14" />
                    <path d="m12 5 7 7-7 7" />
                </svg></button>

        </div>


        <div class="block lg:hidden">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="#0e4503" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-text-align-justify preview-icon">
                <path d="M3 5h18" />
                <path d="M3 12h18" />
                <path d="M3 19h18" />
            </svg>
        </div>


    </header>


    <main>

        <section>

            <div class="flex items-center justify-center min-h-screen px-8">

                <form class="w-full max-w-md border border-stone-400 p-8 sm:p-10 rounded-2xl shadow-lg">

                    <div class="mb-6">
                        <h1 class="text-center text-xl md:text-2xl lg:text-3xl font-bold font-serif">Create Account</h1>
                        <h2 class="text-center text-gray-700 font-serif">Sign up to get started</h2>
                    </div>


                    <div>
                        <label class="block text-gray-900 font-serif text-shadow-lg my-2 text-lg" for="text">Full
                            Name</label>
                        <input placeholder="Enter your full name" class="bg-white rounded-lg
                               px-5 py-3 w-full focus:outline-none focus:ring-1 focus:ring-gray-900
                               border border-gray-300" type="text" name="" id="">
                    </div>

                    <div>
                        <label class="block text-gray-900 font-serif text-shadow-lg my-2 text-lg" for="email">Email
                            Address</label>
                        <input placeholder="Enter your email" class="bg-white rounded-lg
                               px-5 py-3 w-full focus:outline-none focus:ring-1 focus:ring-gray-900
                               border border-gray-300" type="email" name="" id="">
                    </div>

                    <div>
                        <label class="block text-gray-900 font-serif text-shadow-lg my-2 text-lg"
                            for="password">Password</label>
                        <input placeholder="Create a password" class="bg-white rounded-lg
                               px-5 py-3 w-full focus:outline-none focus:ring-1 focus:ring-gray-900
                               border border-gray-300" type="password" name="" id="">
                    </div>

                    <div>
                        <label class="block text-gray-900 font-serif text-shadow-lg my-2 text-lg" for="password">Confirm
                            Password</label>
                        <input placeholder="Confirm a password" class="bg-white rounded-lg
                               px-5 py-3 w-full focus:outline-none focus:ring-1 focus:ring-gray-900
                               border border-gray-300" type="password" name="" id="">
                    </div>

                    <div class="flex items-center gap-2.5 my-2">
                        <input type="checkbox" name="" id="">
                        <h2 class="font-serif text-sm text-gray-900">I agree to the terms & conditions</h2>
                    </div>

                    <div>
                        <button class="bg-green-900 cursor-pointer text-white font-bold font-serif w-full rounded-lg shadow-md py-3 my-2 hover:bg-white hover:text-green-900
                            hover:border-2 border-green-900 hover:scale-105 transition-all duration-500">Create
                            Account</button>
                    </div>



                </form>



            </div>



        </section>

    </main>


</body>

</html>
